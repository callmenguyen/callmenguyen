name: Daily quote

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick a new quote
        run: python au.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/great_list.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update daily quote"
            git push
          fi
